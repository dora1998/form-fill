<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>説明のない住所3欄</title></head>
<body><h1>説明のない住所3欄</h1><p>架空情報用。送信は行いません。</p>
<form><input type="hidden" name="test_token" value="fixture-token">
<div class="field"><h2 class="field_head">郵便番号</h2><input name="zip" id="zip" type="tel" maxlength="7" placeholder="半角数字7ケタ" value="9999999"></div>
<div class="field"><h2 class="field_head">住所</h2><!-- ラベル探索はコメントを無視する -->
<input name="addr1" id="addr1" maxlength="50" placeholder="住所１（必須）" value="元の住所1">
<input name="addr2" id="addr2" maxlength="50" placeholder="住所２" value="元の住所2">
<input name="addr3" id="addr3" maxlength="50" placeholder="住所３" value="元の住所3"></div>
<div class="field"><h2 class="field_head">連絡先電話番号</h2><input name="phone" type="tel" placeholder="半角数字10〜15ケタ" maxlength="15"></div>
</form><p>期待: 1000001 / 東京都千代田区 / 千代田1-1 / テストマンション101号室。電話とhiddenは対象外。</p>
</body></html>
