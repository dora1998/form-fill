<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Fill 開発用フォーム</title>
<style>body{font:16px -apple-system,sans-serif;max-width:560px;margin:30px auto;padding:16px}label{display:block;margin:16px 0}input,select{display:block;font:inherit;padding:8px;width:90%}</style></head>
<body>
<h1>日本の姓名・住所フォーム</h1><p>架空データでの実機検証用です。フォームは送信されません。現在の拡張では入力欄を9個検出します。</p>
<form onsubmit="return false">
<label>姓<input name="familyName" autocomplete="family-name"></label>
<label>名<input name="givenName" autocomplete="given-name"></label>
<label>セイ<input name="familyNameKana"></label>
<label>メイ<input name="givenNameKana"></label>
<label>郵便番号<input name="postalCode" autocomplete="postal-code" inputmode="numeric"></label>
<label>都道府県<select name="prefecture" autocomplete="address-level1"><option value="">選択してください</option><option value="13">東京都</option><option value="27">大阪府</option></select></label>
<label>市区町村<input name="city" autocomplete="address-level2"></label>
<label>町名・番地<input name="street" autocomplete="address-line1"></label>
<label>建物名・部屋番号<input name="building" autocomplete="address-line2"></label>
<input type="hidden" name="token" value="fixture-token">
<label>パスワード（対象外）<input type="password" name="password" autocomplete="new-password"></label>
<button type="button">検証用（送信しません）</button>
</form>
</body></html>
