name: FormFill
options:
  bundleIdPrefix: dev.formfill
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
packages:
  FormFillKit:
    path: Packages/FormFillKit
targets:
  FormFill:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        ProfileKeychainAccessGroup: $(AppIdentifierPrefix)dev.formfill.profiles
        NSFaceIDUsageDescription: 保存した姓名・住所の表示と入力を保護するためにFace IDを使用します。
        CFBundleDisplayName: Form Fill
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: dev.formfill.app
            CFBundleURLSchemes: [formfill]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.formfill.app
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/FormFill.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.formfill.app]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.formfill.profiles]
    dependencies:
      - package: FormFillKit
        product: FormFillCore
      - package: FormFillKit
        product: FormFillApplication
      - package: FormFillKit
        product: FormFillApple
      - target: FormFillExtension
        embed: true
  FormFillExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
        excludes: [Resources, Source]
      - path: SafariExtension/Resources
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        ProfileKeychainAccessGroup: $(AppIdentifierPrefix)dev.formfill.profiles
        NSFaceIDUsageDescription: 保存した姓名・住所の表示と入力を保護するためにFace IDを使用します。
        CFBundleDisplayName: Form Fill
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.formfill.app.extension
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: SafariExtension/FormFillExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.formfill.app]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.formfill.profiles]
    dependencies:
      - package: FormFillKit
        product: FormFillCore
      - package: FormFillKit
        product: FormFillApplication
      - package: FormFillKit
        product: FormFillApple
      - package: FormFillKit
        product: FormFillBridge
      - sdk: SafariServices.framework
schemes:
  FormFill:
    build:
      targets:
        FormFill: all
    run:
      config: Debug
