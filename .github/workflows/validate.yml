name: Validate scaffold
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm test
      - run: npm run check
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - run: brew install xcodegen
      - run: swiftc Shared/FillPlan.swift Tests/Native/main.swift -o /tmp/fill-planner-tests && /tmp/fill-planner-tests
      - run: swiftc Shared/DebugReportStore.swift Tests/Native/debug-report-store.swift -o /tmp/debug-report-tests && /tmp/debug-report-tests
      - run: xcodegen generate
      - run: git diff --exit-code -- App/Info.plist SafariExtension/Info.plist
      - run: >-
          xcodebuild -project FormFill.xcodeproj -scheme FormFill
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
