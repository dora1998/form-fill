name: Validate Form Fill
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:browser
  ios:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: brew install xcodegen
      - run: pnpm test:native
      - run: xcodegen generate
      - run: git diff --exit-code -- App/Info.plist SafariExtension/Info.plist
      - run: >-
          xcodebuild -project FormFill.xcodeproj -scheme FormFill
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: python3 scripts/check-scaffold.py build/Build/Products/Debug-iphonesimulator/FormFill.app/PlugIns/FormFillExtension.appex
